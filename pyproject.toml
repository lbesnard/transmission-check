[project]
name = "transmission-check"
version = "0.1.0"
description = "List files/folders in Transmission's data folders that Transmission doesn't know about"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
transmission-check = "transmission_orphans:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["transmission_orphans"]
